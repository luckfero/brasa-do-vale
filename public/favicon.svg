<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Brasa do Vale</title>
  <!-- O espeto com três cortes.
       Substituiu, em 2026-08-11, uma composição de três formas sobrepostas
       (chama externa, vale branco e chama interna) que em 16px, o tamanho
       real de uma aba, virava uma mancha dourada indistinta.

       Silhueta de bife não serve para marca pequena: vira borrão. O espeto
       é o que o brasileiro decodifica na hora, e resolve com duas formas
       cheias e nenhuma linha fina. -->
  <rect width="64" height="64" rx="14" fill="#4a1511"/>
  <path d="M32 9v46" stroke="#c7973e" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="#dfbb70">
    <rect x="16" y="13" width="32" height="11" rx="5.5"/>
    <rect x="16" y="27" width="32" height="11" rx="5.5"/>
    <rect x="16" y="41" width="32" height="11" rx="5.5"/>
  </g>
</svg>
